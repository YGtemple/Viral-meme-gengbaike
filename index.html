<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MemeClaw — 网络梗智能检索</title>
<style>
  :root {
    --bg: #0f0f1a;
    --surface: #1a1a2e;
    --surface2: #22223a;
    --border: #2a2a45;
    --text: #e0e0e0;
    --text2: #9090a0;
    --accent: #00e676;
    --accent2: #00c853;
    --warn: #ff9100;
    --error: #ff5252;
    --radius: 10px;
    --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
    --mono: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  header {
    background: linear-gradient(135deg, var(--surface), #12122a);
    border-bottom: 1px solid var(--border);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    gap: 12px;
    position: sticky;
    top: 0;
    z-index: 10;
    backdrop-filter: blur(12px);
  }
  header .logo {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.5px;
  }
  header .logo span { color: var(--accent); }
  header nav { margin-left: auto; display: flex; gap: 8px; }
  header nav button {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text2);
    padding: 6px 14px;
    border-radius: 20px;
    cursor: pointer;
    font-size: 13px;
    transition: all .2s;
  }
  header nav button:hover, header nav button.active { color: var(--accent); border-color: var(--accent); }

  .layout { display: grid; grid-template-columns: 1fr 380px; gap: 0; min-height: calc(100vh - 53px); }
  @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }

  /* Search Column */
  .search-col { padding: 32px 40px; max-width: 860px; }
  @media (max-width: 900px) { .search-col { padding: 20px 16px; } }
  .search-box {
    display: flex;
    gap: 10px;
    margin-bottom: 28px;
  }
  .search-box input {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 18px;
    font-size: 16px;
    color: var(--text);
    font-family: var(--font);
    outline: none;
    transition: border-color .2s;
  }
  .search-box input:focus { border-color: var(--accent); }
  .search-box input::placeholder { color: #555; }
  .btn {
    background: var(--accent);
    color: #000;
    border: none;
    border-radius: var(--radius);
    padding: 14px 24px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
    transition: all .2s;
    font-family: var(--font);
  }
  .btn:hover { background: var(--accent2); transform: translateY(-1px); }
  .btn:disabled { opacity: .4; cursor: not-allowed; transform: none; }
  .btn-outline {
    background: transparent;
    border: 1px solid var(--accent);
    color: var(--accent);
    padding: 10px 20px;
    font-size: 13px;
    border-radius: 20px;
  }
  .btn-outline:hover { background: rgba(0,230,118,0.08); transform: none; }

  /* Toggle switch */
  .toggle-row { display: flex; align-items: center; gap: 8px; margin-top: -4px; margin-bottom: 20px; }
  .toggle-label { font-size: 12px; color: var(--text2); cursor: pointer; user-select: none; }
  .toggle-switch { position: relative; width: 38px; height: 20px; cursor: pointer; }
  .toggle-switch input { opacity: 0; width: 0; height: 0; }
  .toggle-slider { position: absolute; inset: 0; background: var(--surface2); border: 1px solid var(--border); border-radius: 10px; transition: .25s; }
  .toggle-slider::before { content: ''; position: absolute; left: 2px; top: 2px; width: 14px; height: 14px; background: var(--text2); border-radius: 50%; transition: .25s; }
  .toggle-switch input:checked + .toggle-slider { background: rgba(0,230,118,0.15); border-color: var(--accent); }
  .toggle-switch input:checked + .toggle-slider::before { background: var(--accent); transform: translateX(18px); }

  /* Progress */
  .progress-bar-wrap { background: var(--surface2); border-radius: 6px; height: 6px; margin: 8px 0 12px; overflow: hidden; }
  .progress-bar-inner { height: 100%; background: var(--accent); border-radius: 6px; transition: width .3s ease; width: 0; }
  .progress-status { color: var(--text2); font-size: 12px; margin-bottom: 4px; min-height: 18px; }
  .progress-steps { display: flex; gap: 4px; margin-bottom: 12px; flex-wrap: wrap; }
  .progress-step { font-size: 10px; padding: 2px 8px; border-radius: 10px; background: var(--surface2); color: var(--text2); transition: all .3s; }
  .progress-step.active { background: rgba(0,230,118,0.15); color: var(--accent); }
  .progress-step.done { background: rgba(0,230,118,0.08); color: #00a152; }

  /* Cards */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    margin-bottom: 20px;
    animation: fadeIn .3s ease;
  }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .card h2 { font-size: 19px; margin-bottom: 12px; color: var(--accent); }
  .card h3 { font-size: 16px; margin: 14px 0 8px; color: var(--text); }
  .card p { line-height: 1.7; color: var(--text2); margin-bottom: 8px; }
  .card a { color: var(--accent); text-decoration: none; }
  .card a:hover { text-decoration: underline; }
  .card strong { color: var(--text); }
  .card ul, .card ol { padding-left: 20px; margin: 8px 0; }
  .card li { color: var(--text2); line-height: 1.6; margin: 4px 0; }
  .card hr { border: none; border-top: 1px solid var(--border); margin: 16px 0; }
  .card blockquote { border-left: 3px solid var(--accent); padding: 6px 14px; color: var(--text2); font-style: italic; margin: 10px 0; }
  .card code { background: var(--surface2); padding: 2px 6px; border-radius: 4px; font-family: var(--mono); font-size: 13px; }

  .tag {
    display: inline-block;
    background: rgba(0,230,118,0.1);
    color: var(--accent);
    padding: 3px 10px;
    border-radius: 12px;
    font-size: 12px;
    margin: 2px 4px 2px 0;
  }
  .video-link {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
  }
  .video-link:last-child { border-bottom: none; }
  .video-link .platform {
    font-size: 11px;
    background: var(--surface2);
    padding: 2px 8px;
    border-radius: 4px;
    color: var(--text2);
    text-transform: uppercase;
  }

  /* Loading */
  .loader {
    display: flex;
    align-items: center;
    gap: 8px;
    color: var(--accent);
    font-size: 15px;
    padding: 32px 0;
    animation: fadeIn .3s ease;
  }
  .loader .dots { display: flex; gap: 4px; }
  .loader .dots span {
    width: 6px; height: 6px;
    background: var(--accent);
    border-radius: 50%;
    animation: bounce 1.4s infinite both;
  }
  .loader .dots span:nth-child(2) { animation-delay: .2s; }
  .loader .dots span:nth-child(3) { animation-delay: .4s; }
  @keyframes bounce { 0%,80%,100% { opacity: .2; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-6px); } }

  .error-box {
    background: rgba(255,82,82,0.08);
    border: 1px solid var(--error);
    border-radius: var(--radius);
    padding: 16px 20px;
    color: var(--error);
    margin-bottom: 20px;
    animation: fadeIn .3s ease;
  }
  .empty-state {
    text-align: center;
    padding: 80px 20px;
    color: var(--text2);
  }
  .empty-state .icon { font-size: 48px; margin-bottom: 12px; opacity: .4; }
  .empty-state p { font-size: 15px; line-height: 1.6; }

  /* Side Panel */
  .side-col {
    background: var(--surface);
    border-left: 1px solid var(--border);
    padding: 24px 20px;
    overflow-y: auto;
  }
  @media (max-width: 900px) { .side-col { border-left: none; border-top: 1px solid var(--border); } }
  .side-col h3 { font-size: 15px; color: var(--accent); margin-bottom: 16px; }
  .side-col .brief-item {
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
  }
  .side-col .brief-item:last-child { border-bottom: none; }
  .side-col .brief-item .name { font-weight: 600; margin-bottom: 4px; }
  .side-col .brief-item .meta { font-size: 12px; color: var(--text2); }
  .side-col .brief-item .heat {
    font-size: 13px;
    margin-top: 4px;
  }

  /* History items */
  .history-item {
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    transition: background .15s;
  }
  .history-item:hover { background: var(--surface2); margin: 0 -8px; padding-left: 8px; padding-right: 8px; border-radius: 4px; }
  .history-item .query { font-weight: 600; font-size: 14px; margin-bottom: 3px; }
  .history-item .info { font-size: 11px; color: var(--text2); display: flex; gap: 10px; }
  .history-item .tag-mini { font-size: 10px; padding: 1px 6px; border-radius: 8px; background: rgba(0,230,118,0.1); color: var(--accent); }
  .side-tabs { display: flex; gap: 8px; margin-bottom: 14px; }
  .side-tab {
    font-size: 12px; padding: 4px 12px; border-radius: 12px; border: 1px solid var(--border);
    background: transparent; color: var(--text2); cursor: pointer; transition: all .2s;
  }
  .side-tab.active { background: rgba(0,230,118,0.12); color: var(--accent); border-color: var(--accent); }

  /* Subscribe Dialog */
  .dialog-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.6);
    display: flex; align-items: center; justify-content: center;
    z-index: 100;
    animation: fadeIn .2s ease;
  }
  .dialog {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 28px;
    width: 90%;
    max-width: 400px;
  }
  .dialog h3 { margin-bottom: 16px; color: var(--accent); }
  .dialog input {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 14px;
    color: var(--text);
    font-size: 14px;
    margin-bottom: 16px;
    outline: none;
    font-family: var(--font);
  }
  .dialog input:focus { border-color: var(--accent); }
  .dialog .actions { display: flex; gap: 10px; justify-content: flex-end; }

  /* Toast */
  .toast {
    position: fixed; top: 20px; right: 20px;
    background: var(--accent); color: #000;
    padding: 12px 20px;
    border-radius: 8px;
    font-weight: 600;
    font-size: 14px;
    z-index: 200;
    animation: slideIn .3s ease;
  }
  @keyframes slideIn { from { opacity: 0; transform: translateX(40px); } to { opacity: 1; transform: translateX(0); } }
</style>
</head>
<body>

<header>
  <div class="logo">🦞 <span>MemeClaw</span></div>
  <nav>
    <button id="navBriefing" onclick="showSidePanel('briefing')">📰 每日情报</button>
    <button id="navHistory" onclick="showSidePanel('history')">🕓 记录</button>
    <button id="navSubscribe" onclick="showSubscribeDialog()">📬 订阅</button>
  </nav>
</header>

<div class="layout">
  <!-- Main Search Column -->
  <div class="search-col">
    <div class="search-box">
      <input id="queryInput" type="text" placeholder="输入梗名，例如：这很开门、遥遥领先……" autofocus
             onkeydown="if(event.key==='Enter')search()">
      <button class="btn" id="searchBtn" onclick="search()">🔍 搜索</button>
    </div>
    <div class="toggle-row">
      <label class="toggle-switch">
        <input type="checkbox" id="autoAnalyzeToggle" onchange="onAutoAnalyzeToggle()">
        <span class="toggle-slider"></span>
      </label>
      <span class="toggle-label" onclick="document.getElementById('autoAnalyzeToggle').click()">🧬 搜索后自动生成深度分析报告</span>
    </div>
    <div id="resultArea">
      <div class="empty-state">
        <div class="icon">🦞</div>
        <p>输入一个梗名，MemeClaw 帮你搜索<br>百科信息、相关视频和深度文化分析</p>
      </div>
    </div>
  </div>

  <!-- Side Panel -->
  <div class="side-col" id="sidePanel">
    <div class="side-tabs">
      <button class="side-tab active" id="tabBriefing" onclick="showSidePanel('briefing')">📰 情报</button>
      <button class="side-tab" id="tabHistory" onclick="showSidePanel('history')">🕓 记录</button>
    </div>
    <div id="panelBriefing">
      <div id="briefingContent">
        <p style="color:var(--text2);font-size:13px;">点击下方按钮获取今日新梗</p>
      </div>
      <button class="btn-outline" style="width:100%;margin-top:16px;" onclick="loadBriefing()">🔄 刷新情报</button>
    </div>
    <div id="panelHistory" style="display:none;">
      <div id="historyContent">
        <p style="color:var(--text2);font-size:13px;">搜索和报告的记录会出现在这里</p>
      </div>
      <button class="btn-outline" style="width:100%;margin-top:16px;color:var(--error);border-color:var(--error);" onclick="clearHistory()">🗑 清除记录</button>
    </div>
  </div>
</div>

<script>
// ── API helpers ──
const API = {
  search: q => fetch(`/search?q=${encodeURIComponent(q)}`).then(r => r.json()),
  analyze: q => fetch(`/analyze?q=${encodeURIComponent(q)}`).then(r => r.json()),
  briefing: () => fetch('/daily-briefing').then(r => r.json()),
  subscribe: body => fetch('/subscribe', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body) }).then(r => r.json())
};

// ── HTML escape ──
function esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

// ── Simple markdown → HTML ──
function md2html(md) {
  if (!md) return '';
  let s = md
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
    // Headers
    .replace(/^### (.+)$/gm, '<h3>$1</h3>')
    .replace(/^## (.+)$/gm, '<h2>$1</h2>')
    // Bold / italic
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>')
    // Inline code
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    // Links
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
    // Horizontal rules
    .replace(/^---$/gm, '<hr>')
    // Blockquote
    .replace(/^&gt; (.+)$/gm, '<blockquote>$1</blockquote>')
    // Unordered lists
    .replace(/^- (.+)$/gm, '<li>$1</li>')
    .replace(/(<li>.*<\/li>\n?)+/g, '<ul>$&</ul>')
    // Ordered lists
    .replace(/^\d+\. (.+)$/gm, '<li>$1</li>')
    // Line breaks
    .replace(/\n\n/g, '</p><p>')
    .replace(/\n/g, '<br>');
  return '<p>' + s + '</p>';
}

// ── Toast ──
function toast(msg) {
  const t = document.createElement('div');
  t.className = 'toast';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2500);
}

// ── Auto-analyze toggle ──
function onAutoAnalyzeToggle() {
  const checked = document.getElementById('autoAnalyzeToggle').checked;
  localStorage.setItem('memeclaw_auto_analyze', checked ? '1' : '0');
}

function isAutoAnalyzeOn() {
  return localStorage.getItem('memeclaw_auto_analyze') === '1';
}

// Restore toggle state on load
(function() {
  if (isAutoAnalyzeOn()) {
    document.getElementById('autoAnalyzeToggle').checked = true;
  }
})();

// ── Search ──
let currentMeme = '';

async function search() {
  const q = document.getElementById('queryInput').value.trim();
  if (!q) return;

  currentMeme = q;
  const area = document.getElementById('resultArea');
  const btn = document.getElementById('searchBtn');

  area.innerHTML = '<div class="loader"><div class="dots"><span></span><span></span><span></span></div>正在搜索网络最新信息…</div>';
  btn.disabled = true;

  try {
    const data = await API.search(q);
    area.innerHTML = '';

    if (data.error) {
      let html = `<div class="error-box">${esc(data.error)}</div>`;
      if (data.suggestions && data.suggestions.length) {
        html += `<div class="card"><h2>💡 你可能想搜这些梗</h2><div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;">`;
        data.suggestions.forEach(name => {
          html += `<button class="tag" style="cursor:pointer;font-size:14px;padding:8px 16px;border:1px solid var(--border);background:var(--surface2);border-radius:20px;color:var(--accent);" onclick="document.getElementById('queryInput').value='${esc(name)}';search()">${esc(name)}</button>`;
        });
        html += `</div></div>`;
      }
      area.innerHTML = html;
    } else {
      if (data.encyclopedia) renderEncyclopedia(data.encyclopedia);
      if (data.videos && data.videos.videos && data.videos.videos.length) renderVideos(data.videos);
      // Save to history
      saveToHistory({
        query: q,
        time: Date.now(),
        type: 'search',
        result: data.encyclopedia?.definition?.slice(0, 40) || ''
      });
      if (data.encyclopedia) {
        if (isAutoAnalyzeOn()) {
          // Auto-trigger deep analysis without showing the prompt card
          await analyze();
        } else {
          area.innerHTML += `
            <div class="card" style="text-align:center;padding:16px;">
              <p style="margin-bottom:12px;color:var(--text2);">想看更深度的分析？</p>
              <button class="btn-outline" onclick="analyze()">🧬 生成深度文化分析</button>
            </div>`;
        }
      }
    }
  } catch(e) {
    area.innerHTML = `<div class="error-box">搜索失败：${e.message || '网络错误'}</div>`;
  } finally {
    btn.disabled = false;
  }
}

function renderEncyclopedia(enc) {
  const area = document.getElementById('resultArea');
  let timeline = '';
  if (enc.key_timeline && enc.key_timeline.length) {
    timeline = '<h3>📅 关键时间线</h3><ul>' +
      enc.key_timeline.map(t => `<li><strong>${t.date || '?'}</strong> — ${t.event || '?'}</li>`).join('') +
      '</ul>';
  }
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <h2>📖 梗百科：${esc(enc.meme_name)}</h2>
    ${enc.aliases && enc.aliases.length ? '<p>别名：' + enc.aliases.map(a => `<span class="tag">${esc(a)}</span>`).join(' ') + '</p>' : ''}
    <p><strong>定义：</strong>${esc(enc.definition)}</p>
    ${enc.origin_platform ? `<p><strong>起源平台：</strong>${esc(enc.origin_platform)}</p>` : ''}
    ${enc.originator ? `<p><strong>起源者：</strong>${esc(enc.originator)}</p>` : ''}
    ${enc.origin_url ? `<p><strong>原始出处：</strong><a href="${esc(enc.origin_url)}" target="_blank" rel="noopener">${esc(enc.origin_url)}</a></p>` : ''}
    ${timeline}
    ${enc.related_memes && enc.related_memes.length ? '<p><strong>相关梗：</strong>' + enc.related_memes.map(m => `<span class="tag">${esc(m)}</span>`).join(' ') + '</p>' : ''}
  `;
  area.appendChild(card);
}

function renderVideos(vr) {
  const area = document.getElementById('resultArea');
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `<h2>🎬 相关视频</h2>` +
    vr.videos.slice(0, 8).map(v => `
      <div class="video-link">
        <span class="platform">${esc(v.platform)}</span>
        <a href="${esc(v.url)}" target="_blank" rel="noopener">${esc(v.title || '无标题')}</a>
        ${v.view_count ? `<span style="color:var(--text2);font-size:12px;">👀 ${v.view_count}</span>` : ''}
      </div>
    `).join('');
  area.appendChild(card);
}

async function analyze() {
  if (!currentMeme) return;
  const area = document.getElementById('resultArea');
  const loader = document.createElement('div');
  loader.className = 'loader';
  loader.innerHTML = '<div class="dots"><span></span><span></span><span></span></div>正在生成深度文化分析报告，这可能需要 30-60 秒…';
  area.appendChild(loader);
  loader.scrollIntoView({ behavior: 'smooth' });

  try {
    const resp = await fetch(`/analyze?q=${encodeURIComponent(currentMeme)}`);
    if (!resp.ok) {
      // Read server error detail from response body
      let detail = '';
      try {
        const body = await resp.json();
        detail = body.detail || '';
      } catch {}
      throw new Error(detail || `服务器错误 (${resp.status})`);
    }
    const report = await resp.json();
    loader.remove();
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `
      <h2>🧬 深度文化分析：${esc(report.meme_name)}</h2>
      <p><strong>📋 摘要：</strong>${esc(report.summary || '')}</p>
      <h3>📜 模因溯源</h3>
      <p>${esc(report.meme_genealogy || '')}</p>
      <h3>🔄 变异与选择</h3>
      <p>${esc(report.variation_analysis || '')}</p>
      <h3>🧠 社会心理映射</h3>
      <p>${esc(report.social_psychology || '')}</p>
      <h3>📈 生命周期预测</h3>
      <p>${esc(report.lifecycle_prediction || '')}</p>
      ${report.propagation_path ? `<h3>🗺 传播路径</h3><code style="white-space:pre-wrap;">${esc(report.propagation_path)}</code>` : ''}
      ${report.footnotes && report.footnotes.length ? '<h3>📚 参考文献</h3><ol>' + report.footnotes.map(f => `<li>${esc(f)}</li>`).join('') + '</ol>' : ''}
    `;
    area.appendChild(card);
    card.scrollIntoView({ behavior: 'smooth' });
    // Save to history
    saveToHistory({
      query: currentMeme,
      time: Date.now(),
      type: 'analyze',
      result: report.summary?.slice(0, 40) || ''
    });
  } catch(e) {
    loader.remove();
    const err = document.createElement('div');
    err.className = 'error-box';
    err.textContent = `分析失败：${e.message || '网络错误'}`;
    area.appendChild(err);
  }
}

// ── Briefing ──
const BRIEFING_STEPS = [
  { key: 'search', label: '搜索平台' },
  { key: 'search_done', label: '获取结果' },
  { key: 'judge', label: 'LLM判断' },
  { key: 'format', label: '生成简报' },
];

function _renderProgress(steps, activeKey) {
  let html = '<div class="progress-steps">';
  steps.forEach(s => {
    const cls = s.key === activeKey ? 'active' : '';
    html += `<span class="progress-step ${cls}">${s.label}</span>`;
  });
  html += '</div>';
  return html;
}

function _renderBriefingResult(data) {
  if (!data || (!data.briefing && !data.confirmed_hot_memes?.length && !data.candidates?.length)) {
    return `<div style="text-align:center;padding:20px 0;">
      <p style="font-size:32px;margin-bottom:8px;opacity:.4;">📭</p>
      <p style="color:var(--text2);font-size:13px;">今日暂未发现新的热梗</p>
      <p style="color:var(--text2);font-size:11px;margin-top:4px;">${data?.summary ? esc(data.summary) : '请稍后再试或明日再查看'}</p>
    </div>`;
  }
  const scanDate = data.scan_date?.slice(0, 10) || '';
  let html = '';

  // Stats bar
  const confirmedCount = data.confirmed_count ?? data.confirmed_hot_memes?.length ?? 0;
  const candidateCount = data.candidates_count ?? data.candidates?.length ?? 0;
  html += `<p style="color:var(--text2);font-size:11px;margin-bottom:12px;">
    📅 ${scanDate} · 🔥 ${confirmedCount} 个热梗 · 📋 ${candidateCount} 个候选
  </p>`;

  // Confirmed hot memes (always shown first if present)
  if (data.confirmed_hot_memes && data.confirmed_hot_memes.length) {
    html += `<p style="color:var(--accent);font-size:13px;margin-bottom:8px;">🔥 确认热梗</p>`;
    data.confirmed_hot_memes.forEach((m, i) => {
      const platforms = (m.source_platforms || []).join('、') || '?';
      html += `
        <div class="brief-item">
          <div class="name">${i+1}. ${esc(m.keyword)} <span style="font-size:11px;color:var(--accent);">${m.hot_score}分</span></div>
          ${m.definition ? `<div class="meta" style="margin-top:4px;">${esc(m.definition)}</div>` : ''}
          <div class="meta" style="margin-top:2px;">📡 ${esc(platforms)}</div>
          ${m.judge_reason ? `<div class="heat">${esc(m.judge_reason)}</div>` : ''}
        </div>`;
    });
  }

  // All candidates (shown when confirmed is empty or as supplementary)
  if (data.candidates && data.candidates.length) {
    const unconfirmed = data.confirmed_hot_memes?.length
      ? data.candidates.filter(c => !data.confirmed_hot_memes.some(h => h.keyword === c.keyword))
      : data.candidates;
    if (unconfirmed.length) {
      html += `<p style="color:var(--warn);font-size:13px;margin:16px 0 8px;">📋 ${data.confirmed_hot_memes?.length ? '更多候选' : '待确认候选'}</p>`;
      unconfirmed.slice(0, 10).forEach((m, i) => {
        const platforms = (m.source_platforms || []).join('、') || '?';
        html += `
          <div class="brief-item" style="opacity:0.75;">
            <div class="name">${i+1}. ${esc(m.keyword)} <span style="font-size:11px;color:var(--warn);">${m.hot_score}分</span></div>
            ${m.definition ? `<div class="meta" style="margin-top:4px;">${esc(m.definition)}</div>` : ''}
            <div class="meta" style="margin-top:2px;">📡 ${esc(platforms)}</div>
            ${m.judge_reason ? `<div class="heat" style="color:var(--text2);">${esc(m.judge_reason)}</div>` : ''}
          </div>`;
      });
    }
  }

  // Fallback: render markdown briefing if nothing structured
  if (!html && data.briefing) {
    html = md2html(data.briefing);
  }

  return html || `<p style="color:var(--text2);">暂无热梗数据</p>`;
}

async function loadBriefing() {
  const content = document.getElementById('briefingContent');

  // Build initial progress UI
  content.innerHTML = `
    <div class="progress-status">正在连接...</div>
    <div class="progress-bar-wrap"><div class="progress-bar-inner" id="briefProgressBar" style="width:5%;"></div></div>
    ${_renderProgress(BRIEFING_STEPS, null)}
  `;

  // Try streaming endpoint first, fall back to non-streaming
  let streamOk = false;
  try {
    const resp = await fetch('/daily-briefing/stream', { cache: 'no-store' });
    if (resp.ok && resp.body) {
      streamOk = await _readBriefingStream(resp, content);
    }
  } catch(e) {
    console.warn('Streaming failed, falling back to non-streaming:', e);
  }

  // Fallback: non-streaming endpoint
  if (!streamOk) {
    content.innerHTML = '<div class="loader"><div class="dots"><span></span><span></span><span></span></div>正在获取情报...</div>';
    try {
      const resp = await fetch('/daily-briefing', { cache: 'no-store' });
      if (!resp.ok) throw new Error(`服务器错误 (${resp.status})`);
      const data = await resp.json();
      content.innerHTML = _renderBriefingResult(data);
    } catch(e2) {
      content.innerHTML = `<div class="error-box">加载失败：${e2.message || '网络错误'}<br><span style="font-size:11px;margin-top:8px;display:inline-block;">请检查后端服务是否正常运行</span></div>`;
    }
  }
}

async function _readBriefingStream(resp, content) {
  const statusEl = content.querySelector('.progress-status');
  const barEl = content.getElementById('briefProgressBar');
  const BAR_STOPS = { search: 20, search_done: 40, judge: 70, format: 90 };

  const reader = resp.body.getReader();
  const decoder = new TextDecoder();
  let buffer = '';
  let gotResult = false;

  try {
    while (true) {
      const { done, value } = await reader.read();
      buffer += decoder.decode(value || new Uint8Array(), { stream: !done });

      const lines = buffer.split('\n');
      buffer = lines.pop();

      for (const line of lines) {
        if (!line.trim()) continue;
        let event;
        try { event = JSON.parse(line); } catch { continue; }

        if (event.type === 'progress') {
          if (statusEl) statusEl.textContent = event.message;
          const pct = BAR_STOPS[event.step] || 50;
          if (barEl) barEl.style.width = pct + '%';
          const steps = content.querySelectorAll('.progress-step');
          steps.forEach(s => {
            s.classList.remove('active');
            const label = BRIEFING_STEPS.find(bs => bs.key === event.step)?.label;
            if (label && s.textContent === label) s.classList.add('active');
          });
        } else if (event.type === 'result') {
          if (barEl) barEl.style.width = '100%';
          content.innerHTML = _renderBriefingResult(event);
          gotResult = true;
          // Don't break — keep reading to drain the stream
        } else if (event.type === 'error') {
          content.innerHTML = `<div class="error-box">${esc(event.message)}</div>`;
          gotResult = false;
        }
      }

      if (done) {
        // Flush remaining buffer
        if (buffer.trim() && !gotResult) {
          try {
            const event = JSON.parse(buffer.trim());
            if (event.type === 'result') {
              if (barEl) barEl.style.width = '100%';
              content.innerHTML = _renderBriefingResult(event);
              gotResult = true;
            }
          } catch {}
        }
        break;
      }
    }
  } catch (e) {
    if (!gotResult) {
      // Only show error if we didn't already get a result
      console.warn('Stream read error (will fallback):', e);
      return false;
    }
  } finally {
    try { reader.releaseLock(); } catch {}
  }
  return gotResult;
}

function showBriefingPanel() {
  showSidePanel('briefing');
  loadBriefing();
}

// ── Subscribe ──
function showSubscribeDialog() {
  const overlay = document.createElement('div');
  overlay.className = 'dialog-overlay';
  overlay.id = 'subscribeDialog';
  overlay.innerHTML = `
    <div class="dialog">
      <h3>📬 订阅每日新梗推送</h3>
      <input id="subUserId" type="text" placeholder="输入你的用户 ID" autofocus>
      <input id="subEmail" type="email" placeholder="邮箱（可选）">
      <div class="actions">
        <button class="btn-outline" onclick="document.getElementById('subscribeDialog').remove()">取消</button>
        <button class="btn" id="subBtn" onclick="doSubscribe()">确认订阅</button>
      </div>
    </div>
  `;
  overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });
  document.body.appendChild(overlay);
  document.getElementById('subUserId').focus();
}

async function doSubscribe() {
  const userId = document.getElementById('subUserId').value.trim();
  if (!userId) { toast('请输入用户 ID'); return; }
  const email = document.getElementById('subEmail').value.trim();
  const btn = document.getElementById('subBtn');
  btn.disabled = true;
  btn.textContent = '提交中…';

  try {
    const resp = await fetch('/subscribe', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ user_id: userId, email: email || undefined }) });
    const res = await resp.json();
    if (!resp.ok) throw new Error(res.detail || res.message || `服务器错误 (${resp.status})`);
    document.getElementById('subscribeDialog').remove();
    toast(res.message || res.detail || '订阅成功！');
  } catch(e) {
    toast('订阅失败：' + (e.message || '网络错误'));
  } finally {
    btn.disabled = false;
    btn.textContent = '确认订阅';
  }
}

// ── Side panel toggle ──
function showSidePanel(panel) {
  const panelBriefing = document.getElementById('panelBriefing');
  const panelHistory = document.getElementById('panelHistory');
  const tabBriefing = document.getElementById('tabBriefing');
  const tabHistory = document.getElementById('tabHistory');
  const sidePanel = document.getElementById('sidePanel');

  if (panel === 'briefing') {
    panelBriefing.style.display = '';
    panelHistory.style.display = 'none';
    tabBriefing.classList.add('active');
    tabHistory.classList.remove('active');
  } else {
    panelBriefing.style.display = 'none';
    panelHistory.style.display = '';
    tabBriefing.classList.remove('active');
    tabHistory.classList.add('active');
    renderHistory();
  }
  sidePanel.scrollIntoView({ behavior: 'smooth' });
}

// ── History (localStorage) ──
const HISTORY_KEY = 'memeclaw_history';
const MAX_HISTORY = 50;

function saveToHistory(entry) {
  let history = [];
  try { history = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]'); } catch {}
  // Remove duplicate query
  history = history.filter(e => e.query !== entry.query);
  history.unshift(entry);
  if (history.length > MAX_HISTORY) history = history.slice(0, MAX_HISTORY);
  localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
}

function loadHistory() {
  try { return JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]'); } catch { return []; }
}

function renderHistory() {
  const content = document.getElementById('historyContent');
  const history = loadHistory();
  if (!history.length) {
    content.innerHTML = '<p style="color:var(--text2);font-size:13px;">暂无记录，搜索一个梗试试</p>';
    return;
  }
  const now = Date.now();
  let html = '';
  history.forEach(e => {
    const mins = Math.floor((now - e.time) / 60000);
    const timeStr = mins < 1 ? '刚刚' : mins < 60 ? `${mins}分钟前` : mins < 1440 ? `${Math.floor(mins/60)}小时前` : `${Math.floor(mins/1440)}天前`;
    const icon = e.type === 'analyze' ? '🧬' : '🔍';
    html += `
      <div class="history-item" onclick="replayHistory('${esc(e.query)}')">
        <div class="query">${icon} ${esc(e.query)}</div>
        <div class="info">
          <span>${timeStr}</span>
          ${e.type === 'analyze' ? '<span class="tag-mini">分析</span>' : ''}
          ${e.result ? `<span style="color:var(--accent);">${esc(e.result)}</span>` : ''}
        </div>
      </div>`;
  });
  content.innerHTML = html;
}

function replayHistory(query) {
  document.getElementById('queryInput').value = query;
  search();
  document.getElementById('resultArea').scrollIntoView({ behavior: 'smooth' });
}

function clearHistory() {
  if (!confirm('确认清除全部记录？')) return;
  localStorage.removeItem(HISTORY_KEY);
  renderHistory();
}
